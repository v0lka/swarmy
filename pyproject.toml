# swarmy — package metadata and quality-tool configuration.
# Canon: architecture.md §3.2; decisions D9 (Pydantic v2), D17 (name), D18 (deepagents pin).
[project]
name = "swarmy"
version = "0.1.0"
description = "Extensible agent system for authorized web-application penetration testing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
authors = [{ name = "swarmy contributors" }]
keywords = ["pentest", "agents", "deepagents", "security", "tui"]
# D18: deepagents pinned to the 0.7 minor line; upgrades only via `make upgrade-deepagents`.
dependencies = [
    "deepagents>=0.7.41,<0.8",
    "pydantic>=2,<3",
    "httpx>=0.27",
    "textual>=1.0",
    "rich>=13.7",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0.4",
    "pyyaml>=6.0",  # guardrails.yaml DSL + AGENT.md frontmatter parsing (arch §6.6, §8.2)
]

[project.scripts]
swarmy = "swarmy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1alpha5",  # F0 decision (roadmap T1.1.1): ty primary, mypy is the declared fallback
    "aiohttp>=3.9",     # echo-app test fixture only (dev-group, arch §15.2)
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmy"]

[tool.hatch.build.targets.sdist]
include = ["src/swarmy", "README.md", "LICENSE", "pyproject.toml"]

# ---- ruff: strict set in the spirit of upstream deepagents (arch §3.2, §15.3) ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (arch §3.2)
    "UP",    # pyupgrade (arch §3.2)
    "B",     # bugbear (arch §3.2)
    "ANN",   # mandatory annotations; ANN401 bans explicit `Any` (D9/G3)
    "ASYNC", # async hygiene
    "C4",    # comprehensions
    "PT",    # pytest style
    "TC",    # type-checking import placement
    "PTH",   # pathlib over os.path (G1: cross-platform core)
    "RUF",   # ruff-specific
]
ignore = [
    "E501", # line length is enforced by the formatter cap; long canonical names are tolerated
]

[tool.ruff.lint.per-file-ignores]
# Domain code keeps the ANN401 ban (`Any` forbidden — G3/D9); the single L0 wrapper
# must receive untyped deepagents values, and tests may build adversarial payloads.
"src/swarmy/core/engine.py" = ["ANN401"]
"tests/**" = ["ANN401"]

# Pydantic evaluates field annotations at class creation, so annotation-only
# imports inside BaseModel subclasses must stay runtime-visible (D9 models).
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
allow-star-arg-any = false
suppress-dummy-args = true

[tool.ruff.lint.isort]
known-first-party = ["swarmy"]

# ---- ty: strict type check of src (arch §3.2, §15.3; Makefile TYPECHECKER default) ----
[tool.ty.src]
include = ["src"]
exclude = ["src/swarmy/agents/**/tools/**"] # module tools validated by the loader (arch §8.5)

[tool.ty.rules]
possibly-unresolved-reference = "warn"
import-not-found = "error" # renamed from `unresolved-import` in ty 0.0.110

# ---- pytest: asyncio auto mode + unit/integration markers (arch §3.2, §15.1) ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast tests mirroring packages, coverage gate 85% (D22)",
    "integration: end-to-end scenarios against the echo app, gate 70% (D22)",
]

# ---- coverage: two suites, two thresholds (D22); excludes are point-only, no blanket omit ----
[tool.coverage.run]
source = ["src/swarmy"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover", # point exceptions only, recorded here (D22)
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
