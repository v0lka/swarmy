# session.yaml — audit snapshot of the resolved session configuration
# (arch §3.3, §12.2). Written at session start and on operator scope
# changes; source of truth for 'what this session actually ran with'.
# Operator secrets live in secrets.yaml (mode 0600) and appear here
# only as <masked:name> references (AD-5, arch §12.3).
target:
  base_url: http://127.0.0.1:3001/
  notes: 'Authorized local pentest demo against the ShopVault demo stack started from
    demos/shop_vault/target (loopback only).

    '
scope:
  domains:
  - localhost
  ip_subnets:
  - 127.0.0.1/32
  ports:
  - 3000
  - 3001
  schemes:
  - http
profile: yolo
mode: mission
model: deepseek:deepseek-flash
limits:
  rate_limit: 5.0
  max_concurrent_requests: 8
  max_body_bytes: 5242880
  max_redirect_depth: 5
  total_request_budget: 5000
  connect_timeout_s: 10.0
  read_timeout_s: 30.0
memory:
  search_backend: fts5
context:
  budgets:
    http_preview_bytes: 20000
    memory_result_bytes: 8000
guardrails:
  engine_rules: true
judge:
  tools: []
  model: null
  confidence_threshold: 0.7
  timeout_s: 15.0
policies:
- 'on': EndpointsDiscovered
  action: notify_orchestrator
  template: generic
- 'on': FindingCandidate
  action: notify_orchestrator
  template: verify_finding
- 'on': FindingVerified
  action: notify_orchestrator
  template: tree_proposal
- 'on': GuardrailBlocked
  action: notify_orchestrator
  template: generic
- 'on': ScopeChanged
  action: notify_orchestrator
  template: generic
mcp_servers: []
agents_dirs: []
secrets: {}
